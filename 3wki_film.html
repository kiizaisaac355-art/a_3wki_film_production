function getPts(p){return (p.goals||0)*5+(p.assists||0)*3-(p.yellow||0)-(p.red||0)*3}
function fmtTime(s){s=Math.max(0,s||0);var add=liveAdded;var lv=d.fixtures.find(function(x){return x.status==='LIVE'});if(lv&&lv.addedTime!=null)add=lv.addedTime;var m=Math.floor(s/60),ss=s%60;if(m>=90&&add>0)return '90+'+(m-90)+':'+(ss<10?'0'+ss:ss);return (m<10?'0'+m:m)+':'+(ss<10?'0'+ss:ss)}

else if(currentPage==='teams'){h+='<div class="card"><h2>TEAMS</h2>'+d.teams.map(function(t){return '<div style="padding:8px;border-bottom:1px solid #eee"><b>'+t+'</b> - Coach: '+(d.coaches[t]||'TBD')+' - Form: '+formStr(t)+' <button onclick="showTeam(\''+t+'\')">View</button></div>'}).join('')+'</div>'}

else if(currentPage==='player'){var pn=window._curPlayer;var p=d.players.find(function(x){return x.name===pn})||{name:pn,team:'-',pos:'Striker',goals:0,assists:0,yellow:0,red:0,apps:0};h+='<div class="card"><button onclick="go(\'players\')">← Back</button><h2>👤 '+p.name+'</h2><p>Team: '+p.team+' | Pos: '+p.pos+' | Age: 24 | Nationality: Uganda</p><p>Apps: '+(p.apps||0)+' | Goals: '+(p.goals||0)+' | Assists: '+(p.assists||0)+' | Yellow: '+(p.yellow||0)+' | Red: '+(p.red||0)+' | Pts: '+getPts(p)+' | Clean Sheets: '+(p.clean||0)+' | Minutes: '+((p.apps||0)*90)+'</p></div>'}
else if(currentPage==='transfers'){h+='<div class="card"><h2>TRANSFERS</h2>'+(isAdmin?'<div><input id="trP" placeholder="Player"><select id="trF">'+d.teams.map(function(t){return '<option>'+t+'</option>'}).join('')+'</select><select id="trT">'+d.teams.map(function(t){return '<option>'+t+'</option>'}).join('')+'</select><input id="trFee" type="number" placeholder="Fee"><button class="green" onclick="doTransfer()">Transfer</button></div>':'')+d.transfers.map(function(t){return '<div>'+t.player+' '+t.from+' → '+t.to+' - Fee: '+t.fee+'</div>'}).join('')+'</div>'}
else if(currentPage==='live'||currentPage==='match'){var f=currentPage==='match'&&currentFixture?d.fixtures.find(function(x){return x.id==currentFixture}):live;if(!f){h+='<div class="card"><h2>LIVE MATCH CENTRE</h2><p>No live match.</p>'+d.fixtures.filter(function(x){return x.status==='UPCOMING'}).slice(0,5).map(function(x){return '<button onclick="openMatch('+x.id+')">'+x.home+' vs '+x.away+'</button>'}).join(' ')+'</div>'}else{fixF(f);h+='<div class="card" style="background:linear-gradient(90deg,#143cdd,#f032ba);color:#fff;text-align:center"><h2>LIVE MATCH CENTRE</h2><div style="font-size:42px;font-weight:900" id="liveTimer">'+fmtTime(getLiveSeconds(f))+'</div><div>'+f.status+' • <span class="live-clock">'+fmtTime(getLiveSeconds(f))+'</span> • Added: +'+(f.addedTime||0)+'</div><div style="font-size:22px;font-weight:900">'+f.home+' '+(f.hs===null?0:f.hs)+' - '+(f.as===null?0:f.as)+' '+f.away+'</div><div>'+f.date+' '+f.time+' | '+f.stadium+' | Ref: '+f.referee+' | Formation: '+(f.formation||'4-4-2')+'</div></div>';if(isAdmin){h+='<div class="card"><b>Admin Live Controls</b><br><input id="scorerName" placeholder="Player name"><select id="scorerTeam"><option value="home">Home: '+f.home+'</option><option value="away">Away: '+f.away+'</option></select><div><button class="gold" onclick="liveAction(\'goal\')">⚽ GOAL</button><button class="gold" onclick="liveAction(\'pen\')">🎯 PENALTY</button><button class="gold" onclick="liveAction(\'assist\')">🅰️ ASSIST</button><button onclick="liveAction(\'yellow\')">🟨 YELLOW</button><button onclick="liveAction(\'red\')">🟥 RED</button><button onclick="liveAction(\'sub\')">🔄 SUB</button></div><div><button class="gold" onclick="addAddedTime(1)">+1 MIN</button><button class="gold" onclick="addAddedTime(2)">+2</button><button class="gold" onclick="addAddedTime(5)">+5</button><button onclick="addAddedTime(0)">CLEAR</button> <button onclick="addMinute('+f.id+',1)">+1 MIN CLOCK</button></div><div><button class="green" onclick="startLive('+f.id+')">START</button><button class="gold" onclick="pauseLive()">PAUSE</button><button class="gold" onclick="resumeLive()">RESUME</button><button class="red" onclick="fullTime()">FULL TIME</button></div><div><b>Lineups</b><input id="lineupH" placeholder="Home lineup" value="'+(f.lineupHome||'')+'"><input id="lineupA" placeholder="Away lineup" value="'+(f.lineupAway||'')+'"><input id="formation" placeholder="Formation 4-4-2" value="'+(f.formation||'')+'"><button class="purple" onclick="saveLineup('+f.id+')">SAVE LINEUP</button></div><div><b>Stats</b><br><button onclick="addStat('+f.id+',\'shots\',\'H\')">Home Shot</button><button onclick="addStat('+f.id+',\'shots\',\'A\')">Away Shot</button><button onclick="addStat('+f.id+',\'corners\',\'H\')">Home Corner</button><button onclick="addStat('+f.id+',\'corners\',\'A\')">Away Corner</button><button onclick="addStat('+f.id+',\'fouls\',\'H\')">Home Foul</button><button onclick="addStat('+f.id+',\'fouls\',\'A\')">Away Foul</button><button onclick="addStat('+f.id+',\'poss\',\'H\')">Poss Home +1%</button><button onclick="shiftMom('+f.id+',-10)">Home Momentum</button><button onclick="shiftMom('+f.id+',10)">Away Momentum</button></div></div>'}h+='<div class="card"><b>📋 LINEUPS • '+(f.formation||'4-4-2')+'</b><br>Home: '+(f.lineupHome||'Not set')+'<br>Away: '+(f.lineupAway||'Not set')+'</div>';h+='<div class="card"><b>📊 MATCH STATS</b><br>Possession: '+f.stats.possH+'% - '+f.stats.possA+'%<br>Shots: '+f.stats.shotsH+' - '+f.stats.shotsA+'<br>On Target: '+f.stats.shotsOnH+' - '+f.stats.shotsOnA+'<br>Corners: '+f.stats.cornersH+' - '+f.stats.cornersA+'<br>Fouls: '+f.stats.foulsH+' - '+f.stats.foulsA+'<br>Momentum: '+f.mom+'% Home</div>';h+='<div class="card"><b>💬 Commentary</b><br>'+((d.commentary[f.id]||[]).map(function(c){return '<div><b>'+c.min+'</b> - '+c.text+'</div>'}).join('')||'No commentary yet')+'</div>'}}
else if(currentPage==='news'){h+='<div class="card"><h2>📰 NEWS</h2>'+(isAdmin?'<input id="newsTitle" placeholder="Title"><input id="newsText" placeholder="Text"><button class="green" onclick="addNews()">POST NEWS</button>':'')+d.news.map(function(n){return '<div class="news"><b>'+n.title+'</b><br>'+n.text+'<br><small>'+n.date+'</small></div>'}).join('')+'</div>'}
else if(currentPage==='polls'){h+='<div class="card"><h2>🗳️ POLLS / MOTM</h2>'+(isAdmin?'<input id="pollQ" placeholder="Poll question"><button class="green" onclick="addPoll()">ADD POLL</button>':'')+d.polls.map(function(pl,i){return '<div class="card">Q: '+pl.q+'<br><button onclick="votePoll('+i+',\'A\')">Yes / A ('+pl.votes.A+')</button><button onclick="votePoll('+i+',\'B\')">No / B ('+pl.votes.B+')</button></div>'}).join('')+'</div>'}
else if(currentPage==='stats'){var totG=d.players.reduce(function(a,p){return a+(p.goals||0)},0);h+='<div class="card"><h2>📊 LEAGUE STATS</h2><p>Total Goals: '+totG+' | FT Matches: '+ft.length+' | Avg: '+(ft.length?(totG/ft.length).toFixed(2):0)+' | Players: '+d.players.length+' | Transfers: '+d.transfers.length+'</p></div>'}
el.innerHTML=h}
setInterval(function(){var lf=d.fixtures.find(function(x){return x.status==='LIVE'});if(!lf)return;var sec=getLiveSeconds(lf);var el=document.getElementById('liveTimer');if(el)el.innerHTML=fmtTime(sec);document.querySelectorAll('.live-clock').forEach(function(e){e.innerHTML=fmtTime(sec)});if(isAdmin&&!lf.paused){lf.matchSeconds=sec;if(sec%2===0)save(true)}},1000);
render();
</script></body></html>
